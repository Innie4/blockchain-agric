[toolchain]
anchor_version = "0.30.1"

[features]
resolution = true
skip-lint = false

[programs.localnet]
agri_trace = "CTKBH9KnbTd8zL4sHNpj4CBPPQcHu2uZk613WpA1ZiDm"

[programs.devnet]
agri_trace = "CTKBH9KnbTd8zL4sHNpj4CBPPQcHu2uZk613WpA1ZiDm"

# Mainnet. The address is fixed by the program's keypair, so it is the same value
# on every cluster until the program is upgraded or replaced. The keypair itself
# lives outside the repository: whoever holds it can upgrade the program, and
# whoever loses it can never upgrade or close it again.
[programs.mainnet-beta]
agri_trace = "CTKBH9KnbTd8zL4sHNpj4CBPPQcHu2uZk613WpA1ZiDm"

[registry]
url = "https://api.apr.dev"

[provider]
cluster = "devnet"
wallet = "~/.config/solana/id.json"

[scripts]
test = "yarn run ts-mocha -p ./tsconfig.json -t 1000000 tests/agri_trace.ts"

[test.validator]
url = "https://api.devnet.solana.com"

[test.genkey]
keypair = "tests/keys/farmer.json"
